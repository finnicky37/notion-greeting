<body>
    <link href="https://fonts.googleapis.com/css?family=Lobster|Roboto:400,700" rel="stylesheet">

<div class="full-table">
    <div class="card">
        <div class="greet" id="greet"></div>
        <div class hidden="date" id="date"></div>
        <div class hidden="clock">
        <div class hidden="time" id="hour"></div>
        <div class hidden="colon">:</div>
        <div class hidden="time" id="min"></div>
        <div class hidden="colon">:</div>
        <div class hidden="time" id="sec"></div>
    </div>
</div>





<script>
    function date() {
var today = new Date();
document.getElementById('date').innerHTML = today.toDateString();
}


function clock() {
var today = new Date();
var hour = zeros(twelveHour(today.getHours()));
var minutes = zeros(today.getMinutes());
var seconds = zeros(today.getSeconds());
if(today.getHours() >=12){
    seconds+=" pm"
}
else{
    seconds+=" am"
}
hrs = today.getHours();
if (hrs < 4)
        greet = 'Happy Twighlight, Finnick.';
    else if (hrs >= 4 && hrs <= 6)
        greet = 'Bright and early, Finnick.';
    else if (hrs >= 6 && hrs <= 12)
        greet = 'Good Morning, Finnick.';
    else if (hrs >= 12 && hrs <= 17)
        greet = 'Good Afternoon, Finnick.';
    else if (hrs >= 17 && hrs <= 21)
        greet = 'Good Evening, Finnick.';
    else if (hrs >= 21 && hrs <= 24)
        greet = 'Good Night, Finnick.';
// console.log(today.toLocaleTimeString());
document.getElementById('greet').innerHTML = greet;
document.getElementById('hour').innerHTML = hour;
document.getElementById('min').innerHTML = minutes;
document.getElementById('sec').innerHTML = seconds;
}

function twelveHour(hour) {
if (hour > 12) {
    return hour -= 12 
} else if (hour === 0) {
    return hour = 12;
} else {
    return hour
}
}
    
// adds zero infront of single digit number
function zeros(num) {
if (num < 10) {
    num = '0' + num
};
return num;
}

function dateTime() {
date();
clock();
setTimeout(dateTime, 500);
}

dateTime()

    document.getElementById('card').innerHTML =
         greet+= "Your name here";
         

// fixes white background around embed in dark mode, and thus fixes light mode issues too. detects theme of notion and changes accordingly.
(function(){
  function setBodyBackground(){
    try{
      const isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.body.style.background = isDark ? '#191919' : '#ffffff';
    } catch(e) {
      document.body.style.background = '#ffffff';
    }
  }
  if(window.matchMedia){
    window.matchMedia('(prefers-color-scheme: dark)').addListener(setBodyBackground);
  }
  setBodyBackground();
})();
// END
</script>
